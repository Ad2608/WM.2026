<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Eingabe</title>

<style>

body{
    font-family:Arial;
    background:#081b29;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    background:white;
    width:500px;
    padding:40px;
    border-radius:20px;
    text-align:center;
}

.price{
    color:green;
    font-size:35px;
    font-weight:bold;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    font-size:16px;
    border-radius:10px;
    border:2px solid #ccc;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:15px;
    background:gold;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="box">

<h1>Email Eingabe</h1>

<div class="price" id="preis">
0€
</div>

<input
type="email"
placeholder="Deine Email-Adresse"
>

<button onclick="weiter()">
Jetzt Bezahlen
</button>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const preis = params.get("price");

document.getElementById("preis").innerHTML =
preis + "€";

function weiter(){

window.location.href =
"bitcoin.html?price=" + preis;

}

</script>

</body>
</html>
